name: Instalar codigo-fonte do Camera Marketing Studio
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/chunk-06.b64'
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Extrair arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/chunk-01.b64
          test -f bootstrap/chunk-02.b64
          test -f bootstrap/chunk-03.b64
          test -f bootstrap/chunk-04.b64
          test -f bootstrap/chunk-05.b64
          test -f bootstrap/chunk-06.b64
          cat bootstrap/chunk-{01..06}.b64 | base64 -d | tar -xJf - -C .
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f supabase/migrations/20261101_001_initial_schema.sql
          node --check app.js
      - name: Publicar arquivos em pastas navegaveis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html styles.css app.js package.json vercel.json .gitignore .env.example docs/ARCHITECTURE.md supabase/
          if ! git diff --cached --quiet; then
            git commit -m "feat: publicar codigo-fonte completo do Camera Marketing Studio"
            git push origin HEAD:main
          fi
