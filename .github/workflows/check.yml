name: Validar codigo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sintaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verificar sintaxe JavaScript
        run: node --check app.js
      - name: Verificar arquivos essenciais
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s supabase/migrations/20261101_001_initial_schema.sql
          test -s supabase/functions/manage-client/index.ts
